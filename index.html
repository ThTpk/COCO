<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2Dto3D — Crocodile</title>
<meta name="description" content="โมเดล 3D ที่สร้างจากภาพ 2D หลายมุมด้วย visual hull แล้ว rig อัตโนมัติ">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #151922;
    --line: #262c36;
    --text: #e8eaed;
    --muted: #8b94a3;
    --accent: #3d85d8;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7f9; --panel: #ffffff; --line: #dfe3ea;
      --text: #14181d; --muted: #5d6673; --accent: #1f62ad;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0d10; --panel: #151922; --line: #262c36;
    --text: #e8eaed; --muted: #8b94a3; --accent: #3d85d8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1 1 auto; }
  header a { color: var(--accent); font-size: 13px; text-decoration: none; }
  header a:hover { text-decoration: underline; }

  main { flex: 1 1 auto; position: relative; min-height: 0; }
  model-viewer {
    width: 100%; height: 100%;
    --poster-color: transparent;
    background: radial-gradient(ellipse at 50% 35%,
                color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%);
  }

  .bar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 7px; max-width: calc(100% - 32px);
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(10px); overflow-x: auto;
  }
  .bar button {
    appearance: none; border: 1px solid transparent; border-radius: 8px;
    padding: 7px 13px; font: inherit; font-size: 13px; white-space: nowrap;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .bar button:hover { color: var(--text); }
  .bar button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    border-color: var(--accent); color: var(--text);
  }

  .meta {
    position: absolute; top: 14px; left: 14px; padding: 10px 13px;
    background: color-mix(in srgb, var(--panel) 85%, transparent);
    border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(10px);
    font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); pointer-events: none;
  }
  .meta b { color: var(--text); font-weight: 600; }

  footer {
    padding: 10px 16px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12px;
  }
  footer a { color: var(--accent); }
  @media (max-width: 540px) {
    .meta { display: none; }
    header h1 { font-size: 15px; }
  }
</style>
<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>

<header>
  <h1>2Dto3D</h1>
  <span class="sub">โมเดลเดียว สร้างจากภาพ 2D หลายมุม แล้ว rig อัตโนมัติ</span>
  <span class="spacer"></span>
  <a href="https://github.com/ThTpk/COCO">source บน GitHub</a>
</header>

<main>
  <model-viewer
    id="mv"
    src="output/character5_rigged.glb"
    alt="ตัวละครจระเข้ สร้างจากภาพ 2D หลายมุม"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="2500"
    rotation-per-second="14deg"
    shadow-intensity="0.9"
    shadow-softness="0.7"
    exposure="1.05"
    camera-orbit="180deg 82deg 4.6m"
    field-of-view="30deg"
    min-field-of-view="12deg"
    max-field-of-view="50deg"
    environment-image="neutral"
    ar ar-modes="webxr scene-viewer quick-look">
    <div class="meta" id="meta">กำลังโหลด…</div>
    <div class="bar" id="bar" slot="" hidden></div>
  </model-viewer>
</main>

<footer>
  ลากเพื่อหมุน · สกรอลล์เพื่อซูม · ปุ่มด้านล่างสลับอนิเมชัน ·
  <a href="output/character5_rigged.glb" download>ดาวน์โหลด .glb</a>
</footer>

<script type="module">
  const mv   = document.getElementById('mv');
  const bar  = document.getElementById('bar');
  const meta = document.getElementById('meta');

  // ปุ่มอนิเมชันสร้างจากคลิปที่อยู่ในไฟล์จริง ไม่ได้ hardcode ชื่อไว้
  // ถ้าวันหลังเปลี่ยนชุดอนิเมชัน หน้านี้จะตามเองโดยไม่ต้องแก้
  mv.addEventListener('load', () => {
    const clips = mv.availableAnimations || [];
    bar.innerHTML = '';

    const mkBtn = (label, onClick) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => {
        [...bar.children].forEach(c => c.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        onClick();
      });
      bar.appendChild(b);
      return b;
    };

    const rest = mkBtn('ท่าพัก', () => { mv.pause(); mv.animationName = undefined; });
    clips.forEach(name => mkBtn(name, () => {
      mv.animationName = name;
      mv.play({ repetitions: Infinity });
    }));

    if (clips.length) {
      bar.hidden = false;
      // เริ่มที่คลิปแรกเพื่อให้เห็นว่ามันขยับได้จริงตั้งแต่เปิดหน้า
      bar.children[1].click();
    } else {
      rest.setAttribute('aria-pressed', 'true');
      bar.hidden = clips.length === 0;
    }

    meta.innerHTML =
      `<b>character5_rigged.glb</b><br>` +
      `อนิเมชัน ${clips.length} ชุด${clips.length ? ': ' + clips.join(', ') : ''}`;
  });

  mv.addEventListener('error', () => {
    meta.textContent = 'โหลดโมเดลไม่สำเร็จ — ตรวจว่าไฟล์ output/character5_rigged.glb อยู่ใน repo';
  });
</script>

</body>
</html>
