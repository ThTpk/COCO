<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2Dto3D — Crocodile</title>
<meta name="description" content="เจ็ดโมเดล 3D ของตัวละครเดียวกัน สร้างจากภาพ 2D คนละวิธี เทียบกันได้ในหน้าเดียว">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #151922;
    --line: #262c36;
    --text: #e8eaed;
    --muted: #8b94a3;
    --accent: #3d85d8;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7f9; --panel: #ffffff; --line: #dfe3ea;
      --text: #14181d; --muted: #5d6673; --accent: #1f62ad;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0d10; --panel: #151922; --line: #262c36;
    --text: #e8eaed; --muted: #8b94a3; --accent: #3d85d8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1 1 auto; }
  header a { color: var(--accent); font-size: 13px; text-decoration: none; }
  header a:hover { text-decoration: underline; }

  /* แถบเลือกโมเดล วางไว้ใต้หัวเรื่องเพราะเป็นสิ่งแรกที่คนมาหน้านี้ต้องใช้ */
  .models {
    display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .models button {
    appearance: none; cursor: pointer; text-align: left; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px;
    background: transparent; color: var(--muted); font: inherit; font-size: 13px;
  }
  .models button:hover { color: var(--text); border-color: var(--muted); }
  .models button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    border-color: var(--accent); color: var(--text);
  }
  .models button .n {
    display: inline-block; min-width: 1.1em; margin-right: 7px;
    font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600;
  }
  .models button .note { color: var(--muted); font-size: 12px; margin-left: 7px; }
  .models button[aria-pressed="true"] .note { color: var(--text); opacity: .75; }

  main { flex: 1 1 auto; position: relative; min-height: 0; }
  model-viewer {
    width: 100%; height: 100%;
    --poster-color: transparent;
    background: radial-gradient(ellipse at 50% 35%,
                color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%);
  }

  .bar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 7px; max-width: calc(100% - 32px);
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(10px); overflow-x: auto;
  }
  /* [hidden] ของเบราว์เซอร์แพ้ display:flex ด้านบน ต้องเขียนทับเอง */
  .bar[hidden] { display: none; }
  .bar button {
    appearance: none; border: 1px solid transparent; border-radius: 8px;
    padding: 7px 13px; font: inherit; font-size: 13px; white-space: nowrap;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .bar button:hover { color: var(--text); }
  .bar button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    border-color: var(--accent); color: var(--text);
  }

  .meta {
    position: absolute; top: 14px; left: 14px; padding: 10px 13px; max-width: 46ch;
    background: color-mix(in srgb, var(--panel) 85%, transparent);
    border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(10px);
    font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); pointer-events: none;
  }
  .meta b { color: var(--text); font-weight: 600; }
  .meta .how {
    display: block; margin-top: 5px; padding-top: 5px;
    border-top: 1px solid var(--line);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px;
  }

  footer {
    padding: 10px 16px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12px;
  }
  footer a { color: var(--accent); }
  /* จอแคบลง กล่องข้อมูลเริ่มทับตัวโมเดลที่อยู่กลางจอ ตัดคำอธิบายยาวออกก่อน */
  @media (max-width: 900px) {
    .meta { max-width: 28vw; }
    .meta .how { display: none; }
  }
  @media (max-width: 640px) {
    .meta { display: none; }
    header h1 { font-size: 15px; }
    .models button .note { display: none; }
  }
</style>
<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>

<header>
  <h1>2Dto3D</h1>
  <span class="sub">ตัวละครเดียวกัน เจ็ดวิธี สร้างจากภาพ 2D ชุดเดิม</span>
  <span class="spacer"></span>
  <a href="https://github.com/ThTpk/COCO">source บน GitHub</a>
</header>

<nav class="models" id="models" aria-label="เลือกโมเดล"></nav>

<main>
  <model-viewer
    id="mv"
    alt="ตัวละครจระเข้ สร้างจากภาพ 2D"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="2500"
    rotation-per-second="14deg"
    shadow-intensity="0.9"
    shadow-softness="0.7"
    exposure="1.05"
    camera-orbit="-25deg 78deg auto"
    field-of-view="30deg"
    min-field-of-view="12deg"
    max-field-of-view="50deg"
    environment-image="neutral"
    ar ar-modes="webxr scene-viewer quick-look">
    <div class="meta" id="meta">กำลังโหลด…</div>
    <div class="bar" id="bar" hidden></div>
  </model-viewer>
</main>

<footer>
  ลากเพื่อหมุน · สกรอลล์เพื่อซูม · ปุ่มบนสลับโมเดล ปุ่มล่างสลับอนิเมชัน ·
  <a id="dl" href="#" download>ดาวน์โหลด .glb</a>
</footer>

<script type="module">
  // เจ็ดเส้นทางที่ลองมาตามลำดับเวลา เก็บไว้ครบเพื่อให้เทียบกันได้ว่าแต่ละวิธีได้อะไรมา
  const MODELS = [
    {
      file: 'output/character_rigged.glb',
      label: 'ภาพนิ่ง 4 มุม',
      note: 'visual hull',
      how: 'แกะ silhouette จากภาพนิ่งหน้า/หลัง/ข้าง แล้วเจาะ voxel grid เป็นรูปทรง ' +
           'ส่วนที่ยื่นอย่างหางกับปากแยกไปปั้นเป็นก้อนของตัวเองก่อนเชื่อมกลับ',
    },
    {
      file: 'output/character2_rigged.glb',
      label: 'คลิป turntable',
      note: 'silhouette ทุกองศา',
      how: 'อ่านมุมกล้อง สเกล และเส้นพื้นออกจากคลิปที่หมุนรอบตัวหนึ่งรอบ ' +
           'ได้ silhouette ทุกองศาแทนที่จะมีแค่สี่มุม',
    },
    {
      file: 'output/character3_rigged.glb',
      label: 'คลิป + ภาพนิ่ง',
      note: 'เอาหัวจากภาพนิ่ง',
      how: 'คลิปมองไม่เห็นหัวจระเข้ มีแค่ 51 จาก 240 เฟรมที่เห็นทั้งตัว ' +
           'visual hull เลยกินปากหายไป รอบนี้เอาลำตัวจากคลิป เอาหัวจากภาพนิ่ง',
    },
    {
      file: 'output/character4_rigged.glb',
      label: '4 เลเยอร์ + Blender',
      note: 'แยกงานของภาพ',
      how: 'เลิกให้ภาพเดียวทำสามหน้าที่พร้อมกัน แยกเป็นเส้นขอบ/สี/ความขรุขระ ' +
           'คนละชุด แล้ว sculpt ต่อใน Blender',
    },
    {
      file: 'output/croc_hunyuan_v4_rigged.glb',
      label: 'Hunyuan3D',
      note: 'generative + rig อัตโนมัติ',
      how: 'ให้โมเดล generative ปั้นรูปทรงจากภาพ แล้วอบสีจากภาพต้นฉบับทับลงไป ' +
           'ได้ผิวละเอียดที่สุดในชุดนี้ ส่วนโครงกระดูกอ่านตำแหน่งข้อต่อจากตัว ' +
           'mesh เองด้วย tools/autorig.py แล้วให้ Blender ผูก weight ให้',
    },
    {
      file: 'output/croc_photo_rigged.glb',
      label: 'ภาพถ่ายพื้นขาว',
      note: 'Comfy Desktop + Blender',
      how: 'ชุดภาพถ่ายพื้นขาวที่วนรอบตัว เข้า Comfy Desktop แล้วได้ mesh 335,000 ' +
           'หน้า ละเอียดกว่าทุกตัวก่อนหน้าเกือบสามเท่า จากนั้น Blender ฉายภาพ ' +
           'ทั้งแปดมุมกลับลงบนผิว โดยทาบ mesh กับภาพด้วยพื้นที่เงา และคัดพิกเซล ' +
           'ที่ถูกส่วนอื่นบังออกด้วย z-buffer — ไม่งั้นแขนในภาพจะไปตกบนเสื้อ ' +
           'กลายเป็นผิวสีส้มเปื้อนอยู่บนผ้ายีนส์ ตอนผสมแปดมุมเข้าด้วยกันใช้ ' +
           'multi-band: สีพื้นเอาค่าเฉลี่ยของทุกมุมซึ่งไม่มีรอยต่อ ส่วนลายผิว ' +
           'เอาจากมุมที่หันตรงที่สุดซึ่งคมกว่า เฉลี่ยรวมทีเดียวจะได้ผิวเบลอ ' +
           'เพราะภาพแต่ละใบทาบกันไม่สนิทระดับพิกเซล สุดท้ายเติมความนูนจาก ' +
           'ตัว mesh เอง — อ่านความโค้งกับความอับแสงของผิวมาคูณกับสีพื้น ' +
           'ลายที่ได้ทาบตรงเป๊ะเพราะมันคือผิวอันเดียวกัน ไม่ใช่ภาพที่เอามาทาบ ' +
           'แล้วใส่โครงกระดูกด้วย tools/autorig.py เหมือนโมเดลที่ 5',
    },
    {
      file: 'output/croc_photo_unirig_rigged.glb',
      label: 'UniRig',
      note: 'กระดูกและผิวจากโมเดล generative',
      how: 'mesh ก้อนเดียวกับโมเดลที่ 6 ทั้ง 334,964 หน้า แต่เปลี่ยนคนใส่กระดูก ' +
           'จาก tools/autorig.py ที่เขียนกฎวางข้อต่อไว้เอง มาเป็น UniRig ' +
           '(SIGGRAPH 2025) บน ComfyUI ซึ่งทำนายทั้งโครงกระดูกและ weight จากตัว ' +
           'mesh เอง ได้ 47 ข้อต่อ มากกว่าเดิมที่มี 29 รวมถึงนิ้วมือข้างละสามนิ้ว ' +
           'และหางที่แยกเป็นหกปล้อง แต่ไฟล์ที่ได้มีแต่กระดูกเปล่า ไม่มีคลิปติดมา ' +
           'และ UniRig ตั้งชื่อข้อต่อว่า bone_0..bone_39 โดยไม่บอกว่าอันไหนคือ ' +
           'ต้นขาอันไหนคือข้อศอก tools/unirig_anim.py จึงอ่านตำแหน่งข้อต่อจาก ' +
           'ไฟล์เพื่อทำตารางแปลชื่อ แล้วยืมชุดคลิปเดียวกับอีกหกตัวมาใช้ ' +
           'ขาที่ UniRig วางไว้ยาวกว่า มุมเท่ากันจึงก้าวไกลกว่าถึงครึ่งตัว ' +
           'ต้องหารช่วงต้นขาเหลือ 0.55 ก้าวจึงเท่าโมเดลที่ 6 และต้องเปิดมุม ' +
           'ข้อเท้าอีกสี่เท่า ให้ปลายเท้าพลิกขึ้นตอนถีบพื้น ไม่งั้นเท้าแข็ง ' +
           'เป็นแผ่นเดียวลากไปกับพื้นทั้งที่ขาแกว่งถูกจังหวะแล้ว ' +
           'รอบนี้เปลี่ยนคนทาสีด้วย โมเดลที่ 6 ฉายภาพถ่ายแปดมุมกลับลงบนผิว ' +
           'ส่วนตัวนี้ให้ Hunyuan3D-Paint วาดสีลงบน mesh ก้อนเดิมจากหกมุมมอง ' +
           'แล้วให้ Blender อบสีจากผิวที่วาดเสร็จกลับมาเป็น texture 2048×2048 ' +
           'ของตัวที่ UniRig ใส่กระดูกไว้แล้ว — สอง mesh นี้ทับกันสนิทพอดี ' +
           '(กรอบนอกตรงกันทุกแกนถึงหลักพัน) bake แบบ selected-to-active จึง ' +
           'ยิงรังสีจากผิวหนึ่งไปอีกผิวหนึ่งได้เลย ไม่ต้องจัดตำแหน่งก่อน ' +
           'สีที่ได้ต่อเนื่องทั้งตัว ไม่มีรอยต่อระหว่างมุมและไม่มีหย่อมสว่างจัด ' +
           'ที่ยังติดมากับภาพถ่ายในแผนที่ของโมเดลที่ 6 แลกกับลายผิวที่เรียบลง ' +
           'เพราะสีมาจากที่โมเดลวาดขึ้นเอง ไม่ใช่พิกเซลจากภาพถ่ายจริง',
    },
  ];

  const mv    = document.getElementById('mv');
  const bar   = document.getElementById('bar');
  const meta  = document.getElementById('meta');
  const rail  = document.getElementById('models');
  const dl    = document.getElementById('dl');

  // ?model=3 ทำให้ส่งลิงก์ชี้โมเดลใดโมเดลหนึ่งได้ตรง ๆ
  const wanted = Number(new URLSearchParams(location.search).get('model'));
  let current = Number.isInteger(wanted) && MODELS[wanted - 1] ? wanted - 1 : MODELS.length - 1;

  MODELS.forEach((m, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span class="n">${i + 1}</span>${m.label}<span class="note">${m.note}</span>`;
    b.addEventListener('click', () => select(i));
    rail.appendChild(b);
  });

  function select(i) {
    current = i;
    [...rail.children].forEach((c, k) => c.setAttribute('aria-pressed', String(k === i)));
    // เปิดด้วย ?model=5 บนจอแคบ ปุ่มที่เลือกอยู่นอกจอ ต้องเลื่อนมาให้เห็น
    rail.children[i].scrollIntoView({ block: 'nearest', inline: 'nearest' });

    const m = MODELS[i];
    bar.hidden = true;        // ซ่อนปุ่มของโมเดลเก่าไว้ก่อน เดี๋ยว load สร้างชุดใหม่
    bar.innerHTML = '';
    meta.textContent = 'กำลังโหลด…';
    dl.href = m.file;
    mv.animationName = undefined;
    mv.src = m.file;

    const url = new URL(location.href);
    url.searchParams.set('model', String(i + 1));
    history.replaceState(null, '', url);
  }

  // ปุ่มอนิเมชันสร้างจากคลิปที่อยู่ในไฟล์จริง ไม่ได้ hardcode ชื่อไว้
  // โมเดลที่ยังไม่ได้ rig จะไม่มีแถบนี้ขึ้นมาเลย
  mv.addEventListener('load', () => {
    const m = MODELS[current];
    const clips = mv.availableAnimations || [];
    bar.innerHTML = '';

    const mkBtn = (label, onClick) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => {
        [...bar.children].forEach(c => c.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        onClick();
      });
      bar.appendChild(b);
      return b;
    };

    if (clips.length) {
      mkBtn('ท่าพัก', () => { mv.pause(); mv.animationName = undefined; });
      clips.forEach(name => mkBtn(name, () => {
        mv.animationName = name;
        mv.play({ repetitions: Infinity });
      }));
      bar.hidden = false;
      // เริ่มที่คลิปแรกเพื่อให้เห็นว่ามันขยับได้จริงตั้งแต่เปิดหน้า
      bar.children[1].click();
    }

    meta.innerHTML =
      `<b>${m.file.split('/').pop()}</b><br>` +
      (clips.length ? `อนิเมชัน ${clips.length} ชุด: ${clips.join(', ')}` : 'โมเดลนิ่ง ไม่มีอนิเมชัน') +
      `<span class="how">${m.how}</span>`;
  });

  mv.addEventListener('error', () => {
    meta.textContent = `โหลดไม่สำเร็จ — ตรวจว่าไฟล์ ${MODELS[current].file} อยู่ใน repo`;
  });

  select(current);
</script>

</body>
</html>
