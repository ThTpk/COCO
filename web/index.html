<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2Dto3D — เดินเล่น</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10;
               font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: #e8eaed; }
  #app { position: fixed; inset: 0; }

  #hud { position: fixed; top: 14px; left: 14px; padding: 12px 14px;
         background: #151922cc; border: 1px solid #262c36; border-radius: 10px;
         backdrop-filter: blur(8px); pointer-events: none; max-width: 260px; }
  #hud h1 { margin: 0 0 6px; font-size: 14px; letter-spacing: .3px; }
  #hud p  { margin: 2px 0; font-size: 12px; color: #9aa4b2; }
  kbd { display: inline-block; min-width: 20px; padding: 1px 5px; margin: 0 1px;
        background: #222934; border: 1px solid #39414f; border-bottom-width: 2px;
        border-radius: 4px; font: 11px/1.5 ui-monospace, monospace; color: #cfd6e0; }

  #stat { position: fixed; top: 14px; right: 14px; padding: 8px 12px;
          background: #151922cc; border: 1px solid #262c36; border-radius: 10px;
          font: 12px/1.6 ui-monospace, monospace; color: #8b94a3; text-align: right; }

  #load { position: fixed; inset: 0; display: grid; place-items: center;
          background: #0b0d10; font-size: 14px; color: #8b94a3; z-index: 5; }
  #load.gone { display: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
         background: #0b0d10; z-index: 6; }
  #err.on { display: grid; }
  #err div { max-width: 540px; padding: 18px 20px; border-radius: 10px;
             background: #2d1a1a; border: 1px solid #6b2b2b; color: #ffc4c4;
             font-size: 13px; line-height: 1.7; }

  /* ปุ่มทิศทางสำหรับจอสัมผัส */
  #pad { position: fixed; left: 18px; bottom: 18px; display: none;
         grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
         gap: 6px; touch-action: none; }
  #pad button { background: #1b212bdd; border: 1px solid #333c4a; border-radius: 10px;
                color: #c9d2de; font-size: 20px; }
  #pad button:active { background: #2b3542dd; }
  #run { position: fixed; right: 18px; bottom: 18px; display: none;
         width: 84px; height: 84px; border-radius: 50%; font-size: 13px;
         background: #1b212bdd; border: 1px solid #333c4a; color: #c9d2de;
         touch-action: none; }
  #run:active { background: #2b3542dd; }
  body.touch #pad { display: grid; }
  body.touch #run { display: block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <h1>เดินเล่น</h1>
  <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> หรือปุ่มลูกศร — เดิน</p>
  <p><kbd>Shift</kbd> — วิ่ง</p>
  <p>ลากเมาส์ — หมุนกล้อง · สกรอลล์ — ซูม</p>
</div>

<div id="stat">—</div>
<div id="load">กำลังโหลดโมเดล…</div>
<div id="err"><div></div></div>

<div id="pad">
  <span></span><button data-k="up">▲</button><span></span>
  <button data-k="left">◀</button><span></span><button data-k="right">▶</button>
  <span></span><button data-k="down">▼</button><span></span>
</div>
<button id="run">วิ่ง</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const MODEL = new URLSearchParams(location.search).get('model')
            || '../output/character_rigged.glb';

// ความเร็วเดินตั้งให้พอดีกับจังหวะก้าวของ clip Walk
// clip ยาว 32 เฟรม @24fps = 1.33 วิ ต่อหนึ่งรอบ (สองก้าว) ตัวละครสูง 2.1 ม.
// ก้าวละราว 0.9 ม. จึงได้ราว 1.35 ม./วินาที ถ้าตั้งผิดจากนี้มากเท้าจะไถลกับพื้น
const WALK_SPEED = 1.35;
const RUN_MULT   = 1.9;      // วิ่ง = เดินเร็วขึ้นเท่านี้ ทั้งความเร็วและจังหวะขา
const TURN_RATE  = 12.0;     // ความเร็วในการหันตัวไปทางที่เดิน (เรเดียน/วินาที)
const ACCEL      = 9.0;

const $ = id => document.getElementById(id);
const fail = msg => { $('err').classList.add('on'); $('err').firstElementChild.innerHTML = msg; };

// ---------- ฉาก ----------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
scene.fog = new THREE.Fog(0x0b0d10, 18, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xbcd6ff, 0x3a3228, 2.0));
const fill = new THREE.DirectionalLight(0xffeedd, 0.8);
fill.position.set(2, 4, 6);
scene.add(fill);

const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9;   sun.shadow.camera.bottom = -9;
sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0015;
scene.add(sun, sun.target);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x161a20, roughness: 0.96 })
);
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(400, 400, 0x2e3744, 0x1d232c);
grid.material.transparent = true;
grid.material.opacity = 0.65;
scene.add(grid);

// ---------- อินพุต -------------------------------------------------------
const keys = new Set();
const KEYMAP = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { keys.add(k); e.preventDefault(); }
  if (e.key === 'Shift') keys.add('run');
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) keys.delete(k);
  if (e.key === 'Shift') keys.delete('run');
});
addEventListener('blur', () => keys.clear());

// ปุ่มบนจอสัมผัส
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
const hold = (el, name) => {
  const on = e => { e.preventDefault(); keys.add(name); };
  const off = e => { e.preventDefault(); keys.delete(name); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('pointercancel', off);
};
$('pad').querySelectorAll('button').forEach(b => hold(b, b.dataset.k));
hold($('run'), 'run');

// กล้อง: หมุนรอบตัวละครด้วยการลาก ซูมด้วยสกรอลล์
let camYaw = 0, camDist = 6.5, camHeight = 2.6, dragging = false, lastX = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.006;
  lastX = e.clientX;
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.004, 2.5, 16);
}, { passive: false });

// ---------- ตัวละคร ------------------------------------------------------
const rig = new THREE.Group();          // ตัวนี้คือสิ่งที่เคลื่อนที่จริง
scene.add(rig);

let mixer = null;
const actions = {};
let current = null;
let height = 2.0;

const velocity = new THREE.Vector3();
const wanted = new THREE.Vector3();
let facing = 0;

function play(name, fade = 0.22) {
  const next = actions[name];
  if (!next || next === current) return;
  next.reset().setEffectiveWeight(1).fadeIn(fade).play();
  if (current) current.fadeOut(fade);
  current = next;
}

// ไฟล์ที่บีบด้วย Draco ต้องมี decoder ไม่งั้นโหลดไม่ขึ้นเลย
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://unpkg.com/three@0.169.0/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

gltfLoader.load(MODEL, gltf => {
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  // วางให้ฝ่าเท้าอยู่ที่ y=0 พอดี เผื่อ origin ของไฟล์ไม่ได้อยู่ที่พื้น
  const box = new THREE.Box3().setFromObject(model);
  height = box.max.y - box.min.y;
  model.position.y -= box.min.y;
  rig.add(model);

  mixer = new THREE.AnimationMixer(model);
  for (const clip of gltf.animations) {
    const a = mixer.clipAction(clip);
    a.setLoop(THREE.LoopRepeat, Infinity);
    actions[clip.name] = a;
  }
  if (!actions.Idle || !actions.Walk) {
    fail('ไฟล์นี้ไม่มี clip ชื่อ <b>Idle</b> หรือ <b>Walk</b><br>'
       + 'มีอยู่: ' + (gltf.animations.map(c => c.name).join(', ') || '— ไม่มีเลย —')
       + '<br><br>สร้างใหม่ด้วย <code>--rig blender</code> ซึ่งจะใส่ clip มาให้');
    return;
  }
  play('Idle', 0);

  camDist = height * 3.6;
  camHeight = height * 1.05;
  // วางกล้องเข้าที่ทันที ไม่งั้นเฟรมแรก ๆ จะเห็นกล้องไหลเข้ามาจากจุดกำเนิด
  camera.position.set(0, camHeight, -camDist);
  camera.lookAt(0, height * 0.55, 0);
  $('load').classList.add('gone');
}, undefined, e => {
  fail('โหลดโมเดลไม่สำเร็จ: ' + (e?.message || e) + '<br><br>'
     + 'หน้านี้ต้องเปิดผ่าน http ไม่ใช่ file:// ให้รัน<br>'
     + '<code>.venv\\Scripts\\python.exe -m http.server 8777</code><br>'
     + 'แล้วเปิด <code>http://localhost:8777/web/</code>');
});

// ---------- ลูป ----------------------------------------------------------
const clock = new THREE.Clock();
const camPos = new THREE.Vector3();
let shownSpeed = 0;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  // ทิศที่กดอยู่ คิดเทียบกับมุมกล้อง ไม่ใช่แกนโลก
  // กด "ขึ้น" จึงหมายถึง "ออกห่างจากกล้อง" เสมอ ไม่ว่าจะหมุนกล้องไปทางไหน
  const ir = (keys.has('right') ? 1 : 0) - (keys.has('left') ? 1 : 0);
  const ifw = (keys.has('up') ? 1 : 0) - (keys.has('down') ? 1 : 0);

  // ประกอบทิศจากเวกเตอร์ของกล้องตรง ๆ แทนการหมุนเวกเตอร์อินพุตแล้วเดาเครื่องหมาย
  //
  // กล้องอยู่ที่ตัวละคร - (sin, cos) * ระยะ ทิศ "ออกห่างจากกล้อง" จึงเป็น (sin, cos)
  // ส่วนทิศขวาของจอคือ forward × up ซึ่งได้ (-cos, sin) — ไม่ใช่ (cos, -sin)
  // ที่ได้จากการหมุนเวกเตอร์ (1,0,0) ตามเข็ม ทั้งสองแกนจึงกลับด้านถ้าเดา
  const ca = Math.cos(camYaw), sa = Math.sin(camYaw);
  wanted.set(sa * ifw - ca * ir, 0, ca * ifw + sa * ir);

  const moving = wanted.lengthSq() > 1e-6;
  if (moving) wanted.normalize();

  const running = moving && keys.has('run');
  const speed = WALK_SPEED * (running ? RUN_MULT : 1);
  const target = moving ? wanted.clone().multiplyScalar(speed) : new THREE.Vector3();
  velocity.lerp(target, 1 - Math.exp(-ACCEL * dt));
  rig.position.addScaledVector(velocity, dt);

  // หันตัวไปทางที่เดิน แบบค่อย ๆ หมุน ไม่ใช่สะบัดทันที
  //
  // โมเดลหันหน้าไปทาง +Z ตามระบบพิกัดของ pipeline มุมหันจึงเป็น atan2(x, z)
  // ไม่ใช่ atan2(z, x) อย่างที่สูตรมุมทั่วไปใช้กัน
  if (moving) {
    const want = Math.atan2(wanted.x, wanted.z);
    let d = want - facing;
    d = Math.atan2(Math.sin(d), Math.cos(d));   // ลัดเลี้ยวทางที่สั้นกว่า
    facing += d * Math.min(1, TURN_RATE * dt);
  }
  rig.rotation.y = facing;

  // เลือก clip จากความเร็วจริง ไม่ใช่จากปุ่มที่กด ตอนชะลอตัวจึงยังเดินต่อ
  const v = velocity.length();
  if (mixer) {
    if (v > 0.12) {
      play('Walk');
      if (current) current.timeScale = v / WALK_SPEED;
    } else {
      play('Idle');
      if (actions.Idle) actions.Idle.timeScale = 1;
    }
    mixer.update(dt);
  }

  // กล้องตามหลัง
  camPos.set(
    rig.position.x - Math.sin(camYaw) * camDist,
    rig.position.y + camHeight,
    rig.position.z - Math.cos(camYaw) * camDist,
  );
  camera.position.lerp(camPos, 1 - Math.exp(-7 * dt));
  camera.lookAt(rig.position.x, rig.position.y + height * 0.55, rig.position.z);

  // เงาตามตัวละครไปด้วย เงาจึงคมตลอดแม้เดินไปไกล
  sun.position.set(rig.position.x + 5, 9, rig.position.z + 4);
  sun.target.position.copy(rig.position);
  sun.target.updateMatrixWorld();

  // พื้นกับเส้นกริดเลื่อนตามเป็นช่อง ๆ ทำให้เดินได้ไม่รู้จบโดยไม่ต้องสร้างฉากใหญ่
  ground.position.set(rig.position.x, 0, rig.position.z);
  grid.position.set(Math.round(rig.position.x), 0, Math.round(rig.position.z));

  shownSpeed += (v - shownSpeed) * Math.min(1, 8 * dt);
  $('stat').textContent =
    `${shownSpeed.toFixed(2)} m/s\n${running && v > 0.12 ? 'วิ่ง' : v > 0.12 ? 'เดิน' : 'ยืน'}`;

  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
